<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plataforma</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111827;
            background-image: url('/img/BH.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background-color: rgba(31, 41, 55, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(167, 139, 250, 0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 { text-align: center; color: #a78bfa; margin-bottom: 30px; }
        label { display: block; margin-bottom: 5px; color: #d1d5db; font-size: 0.9rem; }
        
        /* Campo de texto normal */
        input[type="email"], input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border-radius: 5px; border: 1px solid #4b5563;
            background-color: #374151; color: white; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #a78bfa; box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.3); }

        /* Contenedor del password con el ojito */
        .password-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .password-wrapper input {
            margin-bottom: 0 !important;
            padding-right: 45px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #9ca3af;
            padding: 5px;
            line-height: 1;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: #a78bfa; }

        /* Fila de "Recordarme" */
        .opciones-extra {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }
        .recordarme {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #d1d5db;
        }
        .recordarme input {
            width: auto;
            margin: 0 8px 0 0;
            cursor: pointer;
            accent-color: #8b5cf6;
        }

        /* Botón principal */
        .btn-login {
            width: 100%; padding: 12px; border: none; border-radius: 5px;
            background-color: #8b5cf6; color: white; font-size: 1rem;
            font-weight: bold; cursor: pointer; transition: background 0.3s;
        }
        .btn-login:hover { background-color: #7c3aed; }

        .error { color: #ef4444; text-align: center; margin-bottom: 15px; display: none; font-size: 0.9rem; }
        
        .link-registro {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #9ca3af;
        }
        .link-registro a { color: #a78bfa; text-decoration: none; }
        .link-registro a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🎬 Mi Plataforma</h1>
        <div id="error" class="error">Credenciales incorrectas</div>
        
        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" required placeholder="admin@test.com">
            
            <label>Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="password" required placeholder="••••••">
                <button type="button" class="toggle-password" id="togglePassword" title="Mostrar/ocultar contraseña">👁️</button>
            </div>

            <div class="opciones-extra">
                <label class="recordarme">
                    <input type="checkbox" id="recordarme">
                    Recordarme
                </label>
            </div>
            
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <p class="link-registro">
            ¿No tienes cuenta? <a href="/registro.html">Regístrate aquí</a>
        </p>
    </div>

    <script>
        // ============ 1. MOSTRAR / OCULTAR CONTRASEÑA ============
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const tipoActual = passwordInput.getAttribute('type');
            if (tipoActual === 'password') {
                passwordInput.setAttribute('type', 'text');
                togglePassword.textContent = '🙈';
            } else {
                passwordInput.setAttribute('type', 'password');
                togglePassword.textContent = '👁️';
            }
        });

        // ============ 2. RECORDAR EMAIL ============
        const emailInput = document.getElementById('email');
        const recordarmeCheckbox = document.getElementById('recordarme');
        const emailGuardado = localStorage.getItem('emailRecordado');

        if (emailGuardado) {
            emailInput.value = emailGuardado;
            recordarmeCheckbox.checked = true;
        }

        // ============ 3. LOGIN ============
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';

            try {
                const res = await fetch('/api/usuarios');
                const data = await res.json();

                if (data.success) {
                    const usuarioValido = data.data.find(u => u.email === email && u.password === password);
                    
                    if (usuarioValido) {
                        localStorage.setItem('usuarioLogueado', JSON.stringify(usuarioValido));

                        if (recordarmeCheckbox.checked) {
                            localStorage.setItem('emailRecordado', email);
                        } else {
                            localStorage.removeItem('emailRecordado');
                        }

                        window.location.href = '/dashboard.html';
                    } else {
                        errorDiv.style.display = 'block';
                    }
                }
            } catch (error) {
                alert('Error de conexión con el servidor');
            }
        });
    </script>
</body>
</html>
