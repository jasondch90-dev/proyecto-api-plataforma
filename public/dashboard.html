<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Administración</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #111827; color: #f3f4f6; padding: 20px; }
        .contenedor { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #a78bfa; }
        .btn-logout { background-color: #dc2626; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        
        .menu-tareas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .tarea-card {
            background-color: #1f2937; padding: 30px; border-radius: 10px;
            text-align: center; border: 2px solid #374151; transition: border 0.3s;
        }
        .tarea-card:hover { border-color: #8b5cf6; }
        .tarea-card h2 { margin-bottom: 15px; color: #c4b5fd; }
        .tarea-card p { color: #9ca3af; margin-bottom: 20px; font-size: 0.9rem; }
        .tarea-card a {
            display: inline-block; background-color: #8b5cf6; color: white;
            text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold;
        }
        
        table { width: 100%; border-collapse: collapse; background-color: #1f2937; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #374151; }
        th { background-color: #374151; color: #c4b5fd; }
        tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>Panel de Administración</h1>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </header>

        <div class="menu-tareas">
            <div class="tarea-card">
                <h2>🎬 Tarea 1: Streaming</h2>
                <p>Administrar películas, series y música.</p>
                <a href="/streaming.html">Ir a Streaming</a>
            </div>
            <div class="tarea-card">
                <h2>🌐 Tarea 2: Plataformas Online</h2>
                <p>Administrar cursos, servicios y usuarios.</p>
                <a href="/plataformas.html">Ir a Plataformas</a>
            </div>
        </div>

        <h2 style="margin-bottom: 15px;">👥 Usuarios Registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Fecha de Registro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaUsuarios">
                <tr><td colspan="5" style="text-align: center;">Cargando usuarios...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Verificar si hay sesión activa
        const usuario = localStorage.getItem('usuarioLogueado');
        if (!usuario) {
            window.location.href = '/'; // Si no hay sesión, devolver al login
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado');
            window.location.href = '/';
        }

        // Cargar la tabla de usuarios
        async function cargarUsuarios() {
            try {
                const res = await fetch('/api/usuarios');
                const data = await res.json();
                const tbody = document.getElementById('tablaUsuarios');
                
                if (data.success && data.data.length > 0) {
                    tbody.innerHTML = '';
                    data.data.forEach(u => {
                        const fecha = u.fechaCreacion ? new Date(u.fechaCreacion._seconds * 1000).toLocaleDateString() : 'N/A';
                        tbody.innerHTML += `
                            <tr>
                                <td style="font-family: monospace; font-size: 0.8rem;">${u.id}</td>
                                <td>${u.nombre}</td>
                                <td>${u.email}</td>
                                <td>${fecha}</td>
                                <td>
                                    <button onclick="editarUsuario('${u.id}', '${u.nombre}', '${u.email}')" style="background-color: #d97706; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 5px;">Editar</button>
                                    <button onclick="eliminarUsuario('${u.id}')" style="background-color: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">Eliminar</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay usuarios registrados.</td></tr>';
                }
            } catch (error) {
                console.error("Error cargando usuarios:", error);
            }
        }

        // Función para editar un usuario
        async function editarUsuario(id, nombreActual, emailActual) {
            const nuevoNombre = prompt("Edita el nombre:", nombreActual);
            if (nuevoNombre === null) return; // Si cancela, no hacer nada
            
            const nuevoEmail = prompt("Edita el email:", emailActual);
            if (nuevoEmail === null) return;

            try {
                const res = await fetch(`/api/usuarios/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nuevoNombre, email: nuevoEmail })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Usuario actualizado 🚀');
                    cargarUsuarios(); // Recargar la tabla
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error de conexión al actualizar');
            }
        }

        // Función para eliminar un usuario
        async function eliminarUsuario(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar este usuario?')) return;
            
            try {
                const res = await fetch(`/api/usuarios/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    alert('Usuario eliminado 🗑️');
                    cargarUsuarios(); // Recargar la tabla
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error de conexión al eliminar');
            }
        }

        cargarUsuarios();
    </script>
</body>
</html>
